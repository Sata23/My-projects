# Run from repository root: docker compose --env-file .env -f deploy/compose.entra.yaml up --build
# Place behind a TLS reverse proxy at PUBLIC_BASE_URL. Single-node reference only.
services:
  telecomiq:
    build:
      context: ..
    ports: ["127.0.0.1:8000:8000"]
    env_file: ../.env
    environment:
      TELECOM_DEMO: "false"
    volumes: ["telecom-data:/app/runtime"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  telecom-data:
